<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Instruments</title>

<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@300&display=swap" rel="stylesheet">

<style>
body {
    margin: 0;
    background: #5F6A30;
    color: #FBFFB8;
    font-family: 'Fraunces', serif;
}

/* HEADER */
.header {
    padding: 30px;
}

.header a {
    color: #FBFFB8;
    text-decoration: none;
}

/* LAYOUT */
.container {
    display: flex;
    gap: 60px;
    padding: 40px;
    align-items: center;
}

/* MEDIA */
.media {
    flex: 1;
    display: flex;
    justify-content: center;
}

.media img {
    width: 100%;
    max-width: 400px;
    border-radius: 20px;
    box-shadow: 0 20px 40px rgba(0,0,0,0.4);
}

/* INFO */
.info {
    flex: 1;
}

.info h1 {
    font-size: 40px;
    margin-bottom: 10px;
}

.price {
    margin-bottom: 15px;
}

.info p {
    margin-bottom: 20px;
}

/* BUTTON */
button {
    background: #C8CA89;
    color: #5F6A30;
    padding: 14px 28px;
    border: none;
    border-radius: 8px;
}

/* MOBILE */
@media (max-width: 768px) {

    .container {
        flex-direction: column;
        padding: 20px;
    }

    .info h1 {
        font-size: 28px;
    }

    button {
        width: 100%;
    }
}
</style>
</head>

<body>

<div class="header">
    <a href="index.html">← Back</a>
</div>

<div class="container">

    <div class="media">
        <img src="instruments.png">
    </div>

    <div class="info">
        <h1>Musical Instruments</h1>
        <div class="price">Rp 15</div>
        <p>Organic instrument collection.</p>

        <button>Buy Now</button>
    </div>

</div>

</body>
</html>
