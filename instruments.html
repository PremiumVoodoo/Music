<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Musical Instruments</title>

<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@300&display=swap" rel="stylesheet">

<style>
body {
    margin: 0;
    background: #5F6A30;
    color: #FBFFB8;
    font-family: 'Fraunces', serif;
}

/* CONTAINER */
.container {
    display: flex;
    gap: 80px;
    align-items: center;
    justify-content: center;
    padding: 60px 40px;
}

/* IMAGE */
.media img {
    width: 420px;
    max-width: 100%;
    height: auto;
    object-fit: contain;
    border-radius: 24px;
    box-shadow: 0 25px 50px rgba(0,0,0,0.4);
}

/* TEXT */
.info {
    max-width: 420px;
}

.info h1 {
    font-size: 42px;
    margin-bottom: 10px;
}

.price {
    margin-bottom: 15px;
    font-size: 18px;
}

.info p {
    margin-bottom: 25px;
    line-height: 1.6;
}

/* BUTTON */
button {
    background: #C8CA89;
    color: #5F6A30;
    padding: 14px 30px;
    border: none;
    border-radius: 10px;
    cursor: pointer;
}

/* BACK */
a {
    display: block;
    margin-top: 20px;
    color: #FBFFB8;
    text-decoration: none;
}

/* 📱 MOBILE (THIS IS THE KEY FIX) */
@media (max-width: 768px) {

    .container {
        flex-direction: column;
        align-items: flex-start;   /* 🔥 no centering */
        padding: 20px;
        gap: 20px;
    }

    .media {
        width: 100%;
        display: flex;
        justify-content: center;
    }

    .media img {
        width: 100%;
        max-width: 340px;
    }

    .info {
        width: 100%;
    }

    .info h1 {
        font-size: 28px;
        text-align: left;   /* 🔥 more natural */
    }

    .price {
        font-size: 16px;
    }

    .info p {
        font-size: 14px;
    }

    button {
        width: 100%;
        margin-top: 10px;
    }

    a {
        text-align: left;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="media">
        <img src="instruments.png">
    </div>

    <div class="info">
        <h1>Musical Instruments</h1>
        <div class="price">Rp 15</div>
        <p>Organic instrument collection.</p>

        <button>Buy Now</button>
        <a href="index.html">← Back</a>
    </div>

</div>

</body>
</html>
