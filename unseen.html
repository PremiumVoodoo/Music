<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Unseen EP</title>

<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@300&display=swap" rel="stylesheet">

<style>
body {
    margin: 0;
    background: #5F6A30;
    color: #FBFFB8;
    font-family: 'Fraunces', serif;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
}

.container {
    display: flex;
    gap: 80px;
    align-items: center;
    padding: 20px;
}

img {
    width: 400px;
    border-radius: 18px;
}

.info {
    max-width: 400px;
}

h1 { font-size: 42px; }

button {
    background: #C8CA89;
    color: #5F6A30;
    padding: 12px 28px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
}

a {
    display: block;
    margin-top: 20px;
    color: #FBFFB8;
}

@media (max-width: 768px) {
    .container {
        flex-direction: column;
        text-align: center;
    }

    img {
        width: 90%;
    }
}
</style>
</head>

<body>

<div class="container">
    <img src="unseen.png">

    <div class="info">
        <h1>Unseen EP</h1>
        <p>Rp 10</p>
        <p>Atmospheric cinematic journey.</p>

        <button>Buy Now</button>
        <a href="index.html">← Back</a>
    </div>
</div>

</body>
</html>
