<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Unseen EP</title>

<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@300&display=swap" rel="stylesheet">

<style>
body {
    margin: 0;
    background: #5F6A30;
    color: #FBFFB8;
    font-family: 'Fraunces', serif;
}

.header {
    padding: 30px;
}

.header a {
    color: #FBFFB8;
    text-decoration: none;
}

.wrapper {
    display: flex;
    justify-content: center;
}

.container {
    display: flex;
    gap: 60px;
    padding: 40px;
    align-items: center;
    max-width: 1000px;
    width: 100%;
}

.media {
    flex: 1;
    display: flex;
    justify-content: center;
}

.media video {
    width: 100%;
    max-width: 400px;
    border-radius: 20px;
    box-shadow: 0 20px 40px rgba(0,0,0,0.4);
}

.info {
    flex: 1;
}

.info h1 {
    font-size: 40px;
    margin-bottom: 8px;
}

.price {
    margin-bottom: 12px;
}

.info p {
    margin-bottom: 20px;
}

button {
    background: #C8CA89;
    color: #5F6A30;
    padding: 14px 28px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-family: 'Fraunces', serif;
    font-size: 16px;
}

/* MOBILE */
@media (max-width: 768px) {

    .container {
        flex-direction: column;
        padding: 20px;
        gap: 24px;
    }

    .media img,
    .media video {
        max-width: 100%;
    }

    .info {
        width: 100%;
        max-width: 340px;
        margin: 0 auto;
        text-align: center;
        box-sizing: border-box;
    }

    .info h1 {
        font-size: 28px;
        margin-bottom: 10px;
    }

    .price {
        margin-bottom: 10px;
    }

    .info p {
        margin-bottom: 18px;
    }

    button {
        width: 100%;
        box-sizing: border-box;
    }
}
</style>
</head>

<body>

<div class="header">
    <a href="index.html">← Back</a>
</div>

<div class="wrapper">
<div class="container">

    <div class="media">
        <video autoplay loop muted playsinline>
            <source src="unseen.mp4" type="video/mp4">
        </video>
    </div>

    <div class="info">
        <h1>Unseen EP</h1>
        <div class="price">$3</div>
        <p>Atmospheric cinematic journey.</p>
        <button>Buy Now</button>
    </div>

</div>
</div>

</body>
</html>
