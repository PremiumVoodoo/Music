<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Percussion Sample Pack</title>

<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@300&display=swap" rel="stylesheet">

<style>
body {
    margin: 0;
    background: #5F6A30;
    color: #FBFFB8;
    font-family: 'Fraunces', serif;
}

/* LAYOUT */
.container {
    display: flex;
    gap: 80px;
    padding: 60px 40px;
}

/* MEDIA */
.media {
    flex: 1;
    display: flex;
    justify-content: center;
}

.media img {
    width: 100%;
    max-width: 420px;
    border-radius: 24px;
    box-shadow: 0 25px 50px rgba(0,0,0,0.4);
}

/* INFO */
.info {
    flex: 1;
}

.info h1 {
    font-size: 42px;
}

.price {
    margin: 10px 0;
}

p {
    margin-bottom: 20px;
}

/* BUTTON */
button {
    background: #C8CA89;
    color: #5F6A30;
    padding: 14px 28px;
    border: none;
    border-radius: 8px;
}

/* MOBILE */
@media (max-width: 768px) {
    .container {
        flex-direction: column;
        padding: 20px;
    }

    .info h1 {
        font-size: 28px;
    }

    button {
        width: 100%;
    }
}
</style>
</head>

<body>

<div class="container">
    <div class="media">
        <img src="sample-packs.png?v=2">
    </div>

    <div class="info">
        <h1>Percussion Sample Pack</h1>
        <div class="price">Rp 12</div>
        <p>Organic percussion, flutes and shamanic textures.</p>
        <button>Buy Now</button>
    </div>
</div>

</body>
</html>
