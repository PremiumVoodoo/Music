<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Percussion Sample Pack</title>

<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@300&display=swap" rel="stylesheet">

<style>
body {
    margin: 0;
    background: #5F6A30;
    color: #FBFFB8;
    font-family: 'Fraunces', serif;
}

/* CONTAINER */
.container {
    display: flex;
    gap: 100px;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 40px;
}

/* IMAGE */
.media img {
    width: 420px;
    max-width: 100%;
    height: auto;
    display: block;
    border-radius: 20px;
    box-shadow: 0 25px 50px rgba(0,0,0,0.4);
}

/* TEXT */
.info {
    max-width: 420px;
}

.info h1 {
    font-size: 42px;
    margin-bottom: 20px;
}

.price {
    margin-bottom: 15px;
    font-size: 18px;
}

.info p {
    margin-bottom: 25px;
    line-height: 1.6;
}

/* BUTTON */
button {
    background: #C8CA89;
    color: #5F6A30;
    padding: 12px 28px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
}

/* BACK */
a {
    display: block;
    margin-top: 20px;
    color: #FBFFB8;
    text-decoration: none;
}

/* MOBILE */
@media (max-width: 768px) {

    .container {
        flex-direction: column;
        text-align: center;
        gap: 40px;
    }

    .media img {
        width: 100%;
        max-width: 320px;
    }

    .info h1 {
        font-size: 28px;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="media">
        <img src="afro-pack.png">
    </div>

    <div class="info">
        <h1>Percussion Sample Pack</h1>
        <div class="price">Rp 12</div>
        <p>Organic percussion, flutes and shamanic textures.</p>

        <button>Buy Now</button>
        <a href="index.html">← Back</a>
    </div>

</div>

</body>
</html>
