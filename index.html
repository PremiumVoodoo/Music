<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Premium Voodoo</title>
    <p class="subtitle">Soul Sound Honey and Butter</p>

<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@300&display=swap" rel="stylesheet">

<style>
body {
    margin: 0;
    background: #5F6A30;
    color: #FBFFB8;
    font-family: 'Fraunces', serif;
}

/* HEADER */
.header {
    text-align: center;
    padding: 60px 20px 20px;
}

.header h1 {
    font-size: 64px;
    letter-spacing: 4px;
}

/* PRODUCTS */
.products {
    display: flex;
    justify-content: center;
    gap: 90px;
    margin-top: 80px;
}

.product {
    text-decoration: none;
    text-align: center;
}

.product img,
.product video {
    width: 380px;
    max-width: 100%;
    height: auto;
    display: block;
    border-radius: 20px;
    box-shadow: 0 20px 40px rgba(0,0,0,0.35);
    transition: 0.3s;
}

.product:hover img,
.product:hover video {
    transform: translateY(-10px) scale(1.05);
}

/* TEXT UNDER IMAGES */
.product-title {
    margin-top: 20px;
    font-size: 22px;
    color: #FBFFB8;
}

/* VIDEO SECTION */
.video {
    margin-top: 120px;
    text-align: center;
}

iframe {
    width: 720px;
    height: 405px;
    border-radius: 16px;
    box-shadow: 0 20px 40px rgba(0,0,0,0.4);
}

/* FOOTER */
footer {
    text-align: center;
    margin-top: 100px;
    opacity: 0.6;
}

/* 📱 MOBILE */
@media (max-width: 768px) {

    .header h1 {
        font-size: 36px;
    }

    .products {
        flex-direction: column;
        align-items: center;
        gap: 40px;
        margin-top: 40px;
    }

    .product img,
    .product video {
        width: 100%;
        max-width: 320px;
    }

    iframe {
        width: 90%;
        height: 220px;
    }

    .video {
        margin-top: 60px;
    }

    footer {
        margin-top: 60px;
        font-size: 12px;
    }

    /* MOBILE ORDER */
    .products a:nth-child(1) { order: 2; } /* Sample pack middle */
    .products a:nth-child(2) { order: 1; } /* Unseen top */
    .products a:nth-child(3) { order: 3; } /* Instruments bottom */
}
</style>
</head>

<body>

<div class="header">
    <h1>PREMIUM VOODOO</h1>
</div>

<div class="products">

    <!-- SAMPLE PACK (LEFT ON DESKTOP) -->
    <a href="sample-packs.html" class="product">
        <img src="sample-packs.png" alt="Sample Pack">
        <div class="product-title">Percussion Sample Pack</div>
    </a>

    <!-- UNSEEN (CENTER) -->
    <a href="unseen.html" class="product">
        <video autoplay loop muted playsinline>
            <source src="unseen.mp4" type="video/mp4">
        </video>
        <div class="product-title">Unseen EP</div>
    </a>

    <!-- INSTRUMENTS (RIGHT) -->
    <a href="instruments.html" class="product">
        <img src="instruments.png" alt="Instruments">
        <div class="product-title">Instruments</div>
    </a>

</div>

<div class="video">
    <h2>Latest Releases</h2>
    <iframe src="https://www.youtube.com/embed/lBQsOqGnS84"></iframe>
</div>

<footer>© Premium Voodoo</footer>

</body>
</html>
