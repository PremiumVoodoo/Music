<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Premium Voodoo</title>

<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@300&display=swap" rel="stylesheet">

<style>
body {
    margin: 0;
    background: #5F6A30;
    color: #FBFFB8;
    font-family: 'Fraunces', serif;
}

/* HEADER */
.header {
    text-align: center;
    padding: 60px 20px 10px;
}

.header h1 {
    font-size: 56px;
    letter-spacing: 4px;
}

/* PRODUCTS GRID */
.products {
    display: flex;
    justify-content: center;
    gap: 60px;
    margin-top: 60px;
    padding: 0 20px;
}

/* CARD STYLE */
.product {
    text-decoration: none;
    display: block;
    border-radius: 24px;
    overflow: hidden;
    background: rgba(255,255,255,0.05);
    box-shadow: 0 20px 50px rgba(0,0,0,0.35);
    transition: 0.3s;
    max-width: 360px;
}

.product:hover {
    transform: translateY(-10px) scale(1.02);
}

/* IMAGE FIX */
.product img {
    width: 100%;
    height: auto; /* ✅ FIXED */
    display: block;
}

/* OPTIONAL TITLE UNDER IMAGE */
.product-title {
    padding: 20px;
    font-size: 20px;
    text-align: center;
}

/* VIDEO */
.video {
    margin-top: 100px;
    text-align: center;
}

iframe {
    width: 720px;
    height: 405px;
    border-radius: 16px;
    box-shadow: 0 20px 40px rgba(0,0,0,0.4);
}

/* FOOTER */
footer {
    text-align: center;
    margin-top: 100px;
    opacity: 0.6;
}

/* 📱 MOBILE */
@media (max-width: 768px) {

    .header h1 {
        font-size: 36px;
    }

    .products {
        flex-direction: column;
        align-items: center;
        gap: 30px;
        margin-top: 40px;
    }

    .product {
        width: 90%;
        max-width: 340px;
    }

    iframe {
        width: 90%;
        height: 220px;
    }

    .video {
        margin-top: 60px;
    }

    footer {
        margin-top: 60px;
        font-size: 12px;
    }

    /* 🔥 MOBILE ORDER (FEATURED FIRST) */
    .products a:nth-child(1) { order: 2; } /* Afro */
    .products a:nth-child(2) { order: 1; } /* Unseen */
    .products a:nth-child(3) { order: 3; } /* Instruments */
}
</style>
</head>

<body>

<div class="header">
    <h1>PREMIUM VOODOO</h1>
</div>

<!-- DESKTOP: Afro | Unseen | Instruments -->
<div class="products">

    <a href="afro.html" class="product">
        <img src="afro-pack.png">
        <div class="product-title">Afro Fusion Pack</div>
    </a>

    <a href="unseen.html" class="product">
        <img src="unseen.png">
        <div class="product-title">Unseen EP</div>
    </a>

    <a href="instruments.html" class="product">
        <img src="instruments.png">
        <div class="product-title">Instruments</div>
    </a>

</div>

<div class="video">
    <h2>Latest Releases</h2>
    <iframe src="https://www.youtube.com/embed/lBQsOqGnS84"></iframe>
</div>

<footer>© Premium Voodoo</footer>

</body>
</html>
