<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Premium Voodoo</title>

<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@300&display=swap" rel="stylesheet">

<style>
body {
    margin: 0;
    background: #5F6A30;
    color: #FBFFB8;
    font-family: 'Fraunces', serif;
}

/* HEADER */
.header {
    text-align: center;
    padding: 60px 20px 20px;
}

.header h1 {
    font-size: 64px;
}

.tagline {
    margin-top: 10px;
}

/* PRODUCTS */
.products {
    display: flex;
    justify-content: center;
    gap: 80px;
    margin-top: 60px;
}

.product {
    text-decoration: none;
    color: #FBFFB8;
    text-align: center;
}

.product img,
.product video {
    width: 340px;
    max-width: 100%;
    border-radius: 20px;
    box-shadow: 0 20px 40px rgba(0,0,0,0.35);
}

.product-title {
    margin-top: 16px;
}

/* VIDEO */
.video-section {
    margin-top: 100px;
    display: flex;
    justify-content: center;
}

.video-section iframe {
    width: 720px;
    height: 405px;
    max-width: 90%;
    border-radius: 16px;
    box-shadow: 0 15px 30px rgba(0,0,0,0.3);
}

/* FOOTER */
footer {
    text-align: center;
    margin-top: 100px;
    padding: 30px 20px;
    font-size: 14px;
    opacity: 0.7;
}

/* MOBILE */
@media (max-width: 768px) {

    .products {
        flex-direction: column;
        align-items: center;
        gap: 40px;
    }

    .products a:nth-child(1) { order: 2; }
    .products a:nth-child(2) { order: 1; }
    .products a:nth-child(3) { order: 3; }

    .header h1 {
        font-size: 36px;
    }

    .video-section iframe {
        height: 200px;
    }

    footer {
        margin-top: 60px;
        font-size: 12px;
    }
}
</style>
</head>

<body>

<div class="header">
    <h1>PREMIUM VOODOO</h1>
    <div class="tagline">Sound of Soul — Honey & Butter</div>
</div>

<div class="products">

    <a href="sample-packs.html" class="product">
        <img src="sample-packs.png?v=2">
        <div class="product-title">Percussion Sample Pack</div>
    </a>

    <a href="unseen.html" class="product">
        <video autoplay loop muted playsinline>
            <source src="unseen.mp4">
        </video>
        <div class="product-title">Unseen EP</div>
    </a>

    <a href="instruments.html" class="product">
        <img src="instruments.png">
        <div class="product-title">Instruments</div>
    </a>

</div>

<div class="video-section">
    <iframe src="https://www.youtube.com/embed/lBQsOqGnS84"
            frameborder="0"
            allowfullscreen>
    </iframe>
</div>

<!-- ✅ FOOTER -->
<footer>
    © Premium Voodoo — All rights reserved
</footer>

</body>
</html>
