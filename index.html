<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Premium Voodoo</title>

<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@300&display=swap" rel="stylesheet">

<style>
body {
    margin: 0;
    background: #5F6A30;
    color: #FBFFB8;
    font-family: 'Fraunces', serif;
    -webkit-font-smoothing: antialiased;
}

/* HEADER */
.header {
    text-align: center;
    padding: 60px 20px 20px;
}

.header h1 {
    font-size: 64px;
    letter-spacing: 4px;
}

/* TAGLINE */
.tagline {
    margin-top: 10px;
    font-size: 18px;
    letter-spacing: 2px;
    opacity: 0.8;
}

/* PRODUCTS */
.products {
    display: flex;
    justify-content: center;
    gap: 90px;
    margin-top: 80px;
}

/* PRODUCT */
.product {
    text-decoration: none;
    text-align: center;
}

/* IMAGES */
.product img {
    width: 380px;
    max-width: 100%;
    height: auto;
    display: block;
    border-radius: 20px;
    box-shadow: 0 20px 40px rgba(0,0,0,0.35);
    transition: 0.3s;
}

/* VIDEO */
.product video {
    width: 380px;
    max-width: 100%;
    height: auto;
    display: block;
    border-radius: 20px;
    box-shadow: 0 20px 40px rgba(0,0,0,0.35);
}

/* HOVER */
.product:hover img,
.product:hover video {
    transform: translateY(-10px) scale(1.05);
}

/* TITLE */
.product-title {
    margin-top: 20px;
    font-size: 22px;
    color: #FBFFB8;
}

/* VIDEO SECTION */
.video {
    margin-top: 120px;
    text-align: center;
}

iframe {
    width: 720px;
    height: 405px;
    border-radius: 16px;
    box-shadow: 0 20px 40px rgba(0,0,0,0.4);
}

/* FOOTER */
footer {
    text-align: center;
    margin-top: 100px;
    opacity: 0.6;
}

/* MOBILE */
@media (max-width: 768px) {

    .header h1 {
        font-size: 34px;
        letter-spacing: 2px;
    }

    .tagline {
        font-size: 14px;
        letter-spacing: 1px;
    }

    .products {
        flex-direction: column;
        align-items: center;
        gap: 50px;
        margin-top: 40px;
        padding: 0 20px;
    }

    .product {
        width: 100%;
        max-width: 340px;
    }

    .product img,
    .product video {
        width: 100%;
        border-radius: 18px;
    }

    .product-title {
        font-size: 18px;
        margin-top: 12px;
    }

    .video {
        margin-top: 80px;
        padding: 0 20px;
    }

    iframe {
        width: 100%;
        height: 200px;
    }

    footer {
        margin-top: 60px;
        font-size: 12px;
    }
}
</style>
</head>

<body>

<div class="header">
    <h1>PREMIUM VOODOO</h1>
    <p class="tagline">Sound of Soul — Honey & Butter</p>
</div>

<div class="products">

    <!-- SAMPLE PACK -->
    <a href="sample-packs.html" class="product">
        <img src="sample-packs.png?v=2">
        <div class="product-title">Percussion Sample Pack</div>
    </a>

    <!-- UNSEEN -->
    <a href="unseen.html" class="product">
        <video autoplay loop muted playsinline>
            <source src="unseen.mp4" type="video/mp4">
        </video>
        <div class="product-title">Unseen EP</div>
    </a>

    <!-- INSTRUMENTS -->
    <a href="instruments.html" class="product">
        <img src="instruments.png">
        <div class="product-title">Instruments</div>
    </a>

</div>

<div class="video">
    <h2>Latest Releases</h2>
    <iframe src="https://www.youtube.com/embed/lBQsOqGnS84"></iframe>
</div>

<footer>© Premium Voodoo</footer>

</body>
</html>
